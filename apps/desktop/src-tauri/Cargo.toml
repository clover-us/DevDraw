[package]
name = "devdraw-desktop"
version = "0.3.0"
description = "DevDraw · 研绘 - 面向开发者的推演画布桌面端"
authors = ["DevDraw Contributors"]
edition = "2021"

[lib]
name = "devdraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
